name: ci

on:
  push:
    branches: [main]
  pull_request:

# 检查、前端包、测试和脚手架是并行的 job：检查只用 Go 工具链，测试与检查同时开始。
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l $(go list -f '{{.Dir}}' ./...))"

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  # js 中的前端包：Biome 检查、类型检查和测试。
  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  # tenon init 生成的项目能安装、生成客户端、类型检查、构建并运行（TestInitEndToEnd）；
  # 按 docs/tutorial 做一遍入门教程，用教程的 compose.yaml 启动基础设施（TestTutorial）。
  # 单独一个 job：编译和安装依赖很占 CPU，放在 test 中会干扰计时的测试。
  # 两个测试互不依赖，各用一台机器并行运行。
  scaffold:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: [TestInitEndToEnd, TestTutorial]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # 生成的项目每次 bun install 都要下载依赖，缓存 Bun 的包缓存。依赖由框架的 js 和模板中的 package.json 决定；
      # 两个测试装的包不同，键中带上测试名。
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ matrix.test }}-${{ hashFiles('js/bun.lock', 'cmd/tenon/internal/scaffold/template/**/package.json.tmpl') }}
          restore-keys: bun-${{ runner.os }}-${{ matrix.test }}-

      - name: Scaffold
        run: go test -count=1 -run '^${{ matrix.test }}$' -v ./cmd/tenon/
        env:
          TENON_SCAFFOLD_TEST: "1"

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      gotenberg:
        image: gotenberg/gotenberg:9-chromium
        ports:
          - 3000:3000
        options: >-
          --health-cmd "curl -sf http://localhost:3000/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6334:6334
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      REDIS_TEST_URL: redis://127.0.0.1:6379/0
      NATS_TEST_URL: nats://127.0.0.1:4222
      GOTENBERG_TEST_URL: http://127.0.0.1:3000
      QDRANT_TEST_ADDR: 127.0.0.1:6334
    steps:
      - uses: actions/checkout@v4

      # 服务容器只接受镜像的默认参数，NATS 和 PostgreSQL 在这里启动。
      # 队列用 JetStream 保存任务，-js 开启它。
      - name: Start NATS
        run: |
          docker run -d --name nats -p 127.0.0.1:4222:4222 nats:2.15-alpine nats-server -js -m 8222
          for i in $(seq 1 30); do docker exec nats wget -qO- http://127.0.0.1:8222/healthz && exit 0; sleep 1; done
          docker logs nats
          exit 1

      # 包内的测试并行运行，每个测试有自己的库和连接池，连接数上限调高。
      - name: Start PostgreSQL
        run: |
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_PASSWORD=postgres postgres:18 \
            -c max_connections=500
          for i in $(seq 1 60); do docker exec postgres pg_isready -U postgres -h 127.0.0.1 && exit 0; sleep 1; done
          docker logs postgres
          exit 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # setup-go 自带的缓存按 go.sum 作键，命中后不再保存，框架自己的包每次都要重新编译。
      # 这里每次提交保存一份编译缓存，下一次从最近的一份恢复；Go 会删掉 5 天没用过的条目，缓存不会一直变大。
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-test-${{ runner.os }}-

      # 生成的 TypeScript 客户端用 bun 做类型检查和往返测试（clientgen）。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Test
        run: go test ./...
