name: release

on:
  release:
    types: [published]

# 发布版本时生成 llms-full.txt（全部文档合成一个文件，给大模型读），作为 Release 的附件上传。
# llms.txt 中的 releases/latest/download/llms-full.txt 指向最新版本的这个附件。
jobs:
  llms-full:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate
        run: go run ./internal/llmstxt/gen -full llms-full.txt

      - name: Upload
        run: gh release upload "$TAG" llms-full.txt --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
