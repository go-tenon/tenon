# 集成测试用的临时服务，用法见 AGENTS.md 的“运行测试”。
# 版本与 CI 一致；数据放在 tmpfs 中，down -v 之后不留任何东西。
name: tenon-test

services:
  postgres:
    image: postgres:18
    # 包内的测试并行运行，每个测试有自己的库和连接池，连接数上限调高。
    command: [postgres, -c, max_connections=500]
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - 127.0.0.1:55432:5432
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: pg_isready -U postgres
      interval: 1s
      retries: 60

  redis:
    image: redis:8-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    ports:
      - 127.0.0.1:56379:6379
    healthcheck:
      test: redis-cli ping
      interval: 1s
      retries: 30

  # 队列用 JetStream 保存任务，-js 开启它。
  nats:
    image: nats:2.15-alpine
    command: [nats-server, -js, -sd, /data, -m, "8222"]
    ports:
      - 127.0.0.1:54222:4222
    tmpfs:
      - /data
    healthcheck:
      test: wget -qO- http://127.0.0.1:8222/healthz
      interval: 1s
      retries: 30

  gotenberg:
    image: gotenberg/gotenberg:9-chromium
    ports:
      - 127.0.0.1:53000:3000
    healthcheck:
      test: curl -sf http://127.0.0.1:3000/health
      interval: 1s
      retries: 60

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - 127.0.0.1:56333:6333
      - 127.0.0.1:56334:6334
    tmpfs:
      - /qdrant/storage
    healthcheck:
      test: bash -c ':> /dev/tcp/127.0.0.1/6333'
      interval: 1s
      retries: 30
