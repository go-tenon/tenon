log:
  level: ${LOG_LEVEL:-info}   # debug | info | warn | error
  format: ${LOG_FORMAT:-text} # json | text

http:
  addr: ${HTTP_ADDR:-:8080}
  shutdown_delay: 0s          # Kubernetes 中建议 5s
  trusted_proxies: []         # 部署在反向代理后时填写代理网段，如 ["10.0.0.0/8"]

database:
  dsn: ${DATABASE_URL:-postgres://postgres:postgres@localhost:5432/starter?sslmode=disable}

session:
  lifetime: 24h
  secure_cookie: ${SESSION_SECURE_COOKIE:-false} # 本地 HTTP 调试用 false；HTTPS 部署时设为 true

mail:
  driver: ${MAIL_DRIVER:-log}  # log（只写日志）| smtp | resend
  from: ${MAIL_FROM:-Starter <no-reply@example.com>}
  smtp:
    host: ${SMTP_HOST:-localhost}
    port: ${SMTP_PORT:-587}
    username: ${SMTP_USERNAME:-}
    password: ${SMTP_PASSWORD:-}
  resend:
    api_key: ${RESEND_API_KEY:-}

storage:
  driver: ${STORAGE_DRIVER:-local}  # local | s3
  local:
    dir: ${STORAGE_DIR:-data/storage}
  s3:
    endpoint: ${S3_ENDPOINT:-}        # AWS S3 留空；R2、OSS、MinIO 等填服务地址
    region: ${S3_REGION:-auto}
    bucket: ${S3_BUCKET:-}
    access_key_id: ${S3_ACCESS_KEY_ID:-}
    secret_access_key: ${S3_SECRET_ACCESS_KEY:-}

files:
  max_size: 20971520                 # 20 MiB

base_url: ${BASE_URL:-http://localhost:8080}

account:
  # 生产环境必须通过环境变量设置：openssl rand -base64 48
  jwt_secret: ${JWT_SECRET:-dev-only-secret-0123456789abcdef0123456789}
  # 加密两步验证密钥：openssl rand -base64 32；为空时由 jwt_secret 派生
  encryption_key: ${ENCRYPTION_KEY:-}
  verify_email: true            # 注册后发送邮箱验证邮件

admins:                         # 管理员邮箱，可访问 /admin
  - ${ADMIN_EMAIL:-admin@example.com}

github:                         # 第三方登录，回调地址为 {base_url}/auth/github/callback
  client_id: ${GITHUB_CLIENT_ID:-}
  client_secret: ${GITHUB_CLIENT_SECRET:-}
