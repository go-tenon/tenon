notify.greeting: "{{.Name}}，您好："
notify.welcome.title: 欢迎使用
notify.welcome.body: 可以在账号设置中启用两步验证，保护账号安全。
notify.reset.subject: 重置密码
notify.reset.intro: "我们收到了重置您账号密码的请求。请打开下面的链接设置新密码，链接在 {{.Minutes}} 分钟内有效："
notify.reset.ignore: 如果这不是您本人的操作，请忽略本邮件，您的密码不会改变。
notify.verify.subject: 验证邮箱
notify.verify.intro: "请打开下面的链接验证您的邮箱，链接在 {{.Hours}} 小时内有效："
notify.verify.ignore: 如果您没有注册账号，请忽略本邮件。
notify.export_done.title: "导出完成：{{.File}}"
notify.export_failed.title: "导出失败：{{.File}}"
notify.export_failed.body: 请稍后重试。
