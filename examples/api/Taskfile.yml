version: '3'

vars:
  CONFIG: config.yaml

tasks:
  run:
    desc: 启动 API
    cmds:
      - go run . serve --config {{.CONFIG}}

  migrate:
    desc: 执行迁移
    cmds:
      - go run . migrate up --config {{.CONFIG}}

  openapi:
    desc: 离线导出 OpenAPI
    cmds:
      - go run . openapi

  test:
    desc: 单元与集成测试
    cmds:
      - go test ./...
      - go test -tags=integration ./...
